name: cla

# CLA Assistant Lite (contributor-assistant): on a contributor's first PR it
# posts a comment asking to sign CLA.md; the signature — the exact sentence
# below, posted as a PR comment — is recorded in signatures/cla.json on the
# `cla-signatures` branch of this repo. The check then gates the PR.
on:
  issue_comment:
    types: [created]
  # pull_request_target runs with repo write access, which is what lets the
  # action comment on and set a status for a fork's PR. Safe here: the job
  # never checks out or executes PR code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # writes signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (not tag) — see the note in ci.yml.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/klerik3d/gurt/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: klerik3d,renovate[bot],dependabot[bot]
