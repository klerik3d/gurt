name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (not tag): tags are mutable and a
      # hijacked tag would run attacker code with repo access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx allow-scripts
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - name: tests
        # Runs scripts/*.test.mjs via scripts/run-tests.mjs (exclusions live there).
        run: npm test
