name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA (not tag): tags are mutable and a
      # hijacked tag would run attacker code with repo access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx allow-scripts
      # electron-builder takes the app version from package.json, and
      # electron-updater compares against it — a tag/package.json mismatch
      # would publish artifacts whose version doesn't match the release and
      # break the update chain. The tag is the source of truth: stamp its
      # version (v1.2.3 → 1.2.3) into package.json for this build only.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # Signing + notarization credentials (see the mac section of
      # electron-builder.yml). On a fork without these secrets the env vars
      # are empty and electron-builder skips both steps with a warning
      # instead of failing.
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # electron-builder writes to release/ (directories.output in
      # electron-builder.yml). latest-mac.yml is the update manifest
      # electron-updater's GitHub provider polls — without it, mac auto-update
      # never finds a newer version.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  # Both jobs publish into the same tag's release: action-gh-release appends
  # files to an existing release, so mac and linux artifacts end up together.
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA (not tag) — see the note in the
      # `release` job above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx allow-scripts
      # Same tag→version stamp as the mac job above.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:linux
      # electron-builder writes to release/ (directories.output in
      # electron-builder.yml). latest-linux*.yml is the update manifest
      # electron-updater's GitHub provider polls for the AppImage target —
      # without it, Linux auto-update never finds a newer version. The name is
      # arch-suffixed per electron-builder's convention (latest-linux.yml for
      # x64, latest-linux-arm64.yml for arm64); glob both since the runner's
      # arch can change.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux*.yml
